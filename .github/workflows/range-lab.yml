name: Range lab validation
on:
  push:
    branches: [main]
    paths: ['src/accelerator/**', 'src/gateway/**', 'gateway/**', 'scripts/build-gateway.mjs', 'scripts/build-range.mjs', 'scripts/check-range.mjs', 'scripts/cdn-health.mjs', 'data/cdn-candidates.json', 'tests/**', 'dist/lab/**', 'dist/gateway/**', 'vendor/btr-0302b345/**', 'vendor/loon-range-0.1.12/**', '.github/workflows/range-lab.yml']
  pull_request:
    paths: ['src/accelerator/**', 'src/gateway/**', 'gateway/**', 'scripts/build-gateway.mjs', 'scripts/build-range.mjs', 'scripts/check-range.mjs', 'scripts/cdn-health.mjs', 'data/cdn-candidates.json', 'tests/**', 'dist/lab/**', 'dist/gateway/**', 'vendor/btr-0302b345/**', 'vendor/loon-range-0.1.12/**', '.github/workflows/range-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate automatic policy and verify reproducible artifacts
        run: node scripts/check-range.mjs --check-generated
