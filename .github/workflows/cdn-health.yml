name: CDN candidate health
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cdn-candidate-health
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'aijc123/Bilibili-Redirect-US'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public candidate DNS and validated TLS without video traffic
        env:
          CDN_PROBE_CONTEXT: github-actions
        run: node scripts/cdn-health.mjs
      - name: Publish the health snapshot without changing playback defaults
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'data/cdn-health.json';
            const content = fs.readFileSync(path);
            const snapshot = JSON.parse(content);
            if (snapshot.context !== 'github-actions' || snapshot.changesPlaybackDefault !== false || snapshot.mediaBenchmarkAvailable !== false) {
              throw new Error('Unexpected snapshot policy');
            }
            const identity = {...context.repo, path, ref: 'main'};
            let sha;
            try { sha = (await github.rest.repos.getContent(identity)).data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch: 'main', sha,
              message: 'Update runner DNS/TLS candidate health snapshot', content: content.toString('base64')});
